
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .line { stroke: #9ca3af; stroke-width: 2; }
    .node { fill: #f3f4f6; stroke: #6b7280; stroke-width: 2; }
    .text { font-family: sans-serif; font-size: 12px; fill: #374151; text-anchor: middle; dominant-baseline: middle; }
  </style>
  
  <!-- Lines connecting nodes -->
  <line x1="25" y1="30" x2="50" y2="50" class="line" />
  <line x1="50" y1="50" x2="25" y2="70" class="line" />
  <line x1="50" y1="50" x2="75" y2="50" class="line" />

  <!-- Nodes -->
  <circle cx="25" cy="30" r="10" class="node" />
  <text x="25" y="30">A</text>
  
  <circle cx="50" cy="50" r="10" class="node" />
  <text x="50" y="50">B</text>

  <circle cx="25" cy="70" r="10" class="node" />
  <text x="25" y="70">C</text>

  <circle cx="75" cy="50" r="10" class="node" />
  <text x="75" y="50">D</text>
</svg>
