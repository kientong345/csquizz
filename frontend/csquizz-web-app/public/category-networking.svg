
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <style>
        .node { fill: #60a5fa; stroke: #2563eb; stroke-width: 1.5; }
        .line { stroke: #9ca3af; stroke-width: 1; }
    </style>
    <!-- Lines -->
    <line x1="50" y1="20" x2="30" y2="40" class="line" />
    <line x1="50" y1="20" x2="70" y2="40" class="line" />
    <line x1="30" y1="40" x2="70" y2="40" class="line" />
    <line x1="30" y1="40" x2="50" y2="65" class="line" />
    <line x1="70" y1="40" x2="50" y2="65" class="line" />
    <line x1="50" y1="65" x2="30" y2="90" class="line" />
    <line x1="50" y1="65" x2="70" y2="90" class="line" />

    <!-- Nodes -->
    <circle cx="50" cy="20" r="8" class="node" />
    <circle cx="30" cy="40" r="8" class="node" />
    <circle cx="70" cy="40" r="8" class="node" />
    <circle cx="50" cy="65" r="8" class="node" />
    <circle cx="30" cy="90" r="8" class="node" />
    <circle cx="70" cy="90" r="8" class="node" />
</svg>
