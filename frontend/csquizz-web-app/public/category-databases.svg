
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .cylinder-top { fill: #a5b4fc; }
    .cylinder-side { fill: #818cf8; }
  </style>
  
  <!-- Top cylinder -->
  <ellipse cx="50" cy="30" rx="25" ry="8" class="cylinder-top" />
  <rect x="25" y="30" width="50" height="15" class="cylinder-side" />
  <ellipse cx="50" cy="45" rx="25" ry="8" class="cylinder-top" />

  <!-- Middle cylinder -->
  <ellipse cx="50" cy="50" rx="25" ry="8" class="cylinder-top" />
  <rect x="25" y="50" width="50" height="15" class="cylinder-side" />
  <ellipse cx="50" cy="65" rx="25" ry="8" class="cylinder-top" />

  <!-- Bottom cylinder -->
  <ellipse cx="50" cy="70" rx="25" ry="8" class="cylinder-top" />
  <rect x="25" y="70" width="50" height="15" class="cylinder-side" />
  <ellipse cx="50" cy="85" rx="25" ry="8" class="cylinder-top" />
</svg>
