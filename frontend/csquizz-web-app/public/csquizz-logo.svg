
<svg width="160" height="40" viewBox="0 0 160 40" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #111827; }
    .text { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 24px;
      font-weight: bold;
      fill: #111827;
    }
    .q-text {
        font-size: 26px;
        font-weight: bold;
        fill: #f9fafb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-anchor: middle;
        dominant-baseline: central;
    }
  </style>
  
  <!-- Icon Background -->
  <rect x="0" y="0" width="40" height="40" rx="8" class="bg" />
  <!-- Icon Text 'Q' -->
  <text x="20" y="21" class="q-text">Q</text>

  <!-- Main Text -->
  <text x="50" y="28" class="text">CSQuizz</text>
</svg>
