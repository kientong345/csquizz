
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .line { stroke: #fca5a5; stroke-width: 1; }
    .node { fill: #f87171; }
    .center-node { fill: #ef4444; }
  </style>

  <!-- Center Node -->
  <circle cx="50" cy="50" r="10" class="center-node" />

  <!-- Outer Nodes and Lines -->
  <line x1="50" y1="50" x2="25" y2="25" class="line" />
  <circle cx="25" cy="25" r="6" class="node" />

  <line x1="50" y1="50" x2="75" y2="25" class="line" />
  <circle cx="75" cy="25" r="6" class="node" />

  <line x1="50" y1="50" x2="25" y2="75" class="line" />
  <circle cx="25" cy="75" r="6" class="node" />

  <line x1="50" y1="50" x2="75" y2="75" class="line" />
  <circle cx="75" cy="75" r="6" class="node" />

  <line x1="50" y1="50" x2="50" y2="20" class="line" />
  <circle cx="50" cy="20" r="6" class="node" />

  <line x1="50" y1="50" x2="50" y2="80" class="line" />
  <circle cx="50" cy="80" r="6" class="node" />

  <line x1="50" y1="50" x2="20" y2="50" class="line" />
  <circle cx="20" cy="50" r="6" class="node" />

  <line x1="50" y1="50" x2="80" y2="50" class="line" />
  <circle cx="80" cy="50" r="6" class="node" />
</svg>
