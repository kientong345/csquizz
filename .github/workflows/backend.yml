name: Backend

on:
  push:
    branches: [ "main" ]
    paths:
    - 'backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
    - 'backend/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --profile prod
    - name: Run tests
      run: cargo test --profile prod
