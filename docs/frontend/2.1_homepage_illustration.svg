<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="100%" height="100%" fill="#f0f0f0"/>

    <!-- Header / Navbar -->
    <rect width="100%" height="60" fill="#dcdcdc"/>
    <text x="20" y="35" font-family="Arial" font-size="18" fill="#333">Quiz-Bank Logo</text>
    <text x="650" y="35" font-family="Arial" font-size="16" fill="#333">Đăng nhập</text>
    <text x="730" y="35" font-family="Arial" font-size="16" fill="#333">Đăng ký</text>

    <!-- Main Content Area -->
    <g transform="translate(0, 60)">
        <!-- Search and Title -->
        <text x="50" y="50" font-family="Arial" font-size="24" font-weight="bold" fill="#333">Luyện tập kiến thức Khoa học máy tính</text>
        <rect x="50" y="80" width="700" height="40" rx="5" fill="#fff" stroke="#ccc"/>
        <text x="60" y="105" font-family="Arial" font-size="14" fill="#999">Tìm kiếm chủ đề...</text>

        <!-- Quiz Topic Grid -->
        <g transform="translate(50, 150)">
            <!-- Row 1 -->
            <rect width="220" height="180" rx="10" fill="#fff" stroke="#ccc"/>
            <rect x="10" y="10" width="200" height="80" fill="#e5e7eb" rx="5"/>
            <text x="20" y="115" font-family="Arial" font-size="16" font-weight="bold">Chủ đề 1</text>
            <text x="20" y="135" font-family="Arial" font-size="12" fill="#666">Mô tả ngắn...</text>
            <rect x="70" y="150" width="80" height="25" rx="5" fill="#4CAF50"/>
            <text x="85" y="167" font-family="Arial" font-size="12" fill="#fff">Bắt đầu</text>

            <rect x="240" width="220" height="180" rx="10" fill="#fff" stroke="#ccc"/>
            <rect x="250" y="10" width="200" height="80" fill="#e5e7eb" rx="5"/>
            <text x="260" y="115" font-family="Arial" font-size="16" font-weight="bold">Chủ đề 2</text>

            <rect x="480" width="220" height="180" rx="10" fill="#fff" stroke="#ccc"/>
            <rect x="490" y="10" width="200" height="80" fill="#e5e7eb" rx="5"/>
            <text x="500" y="115" font-family="Arial" font-size="16" font-weight="bold">Chủ đề 3</text>

            <!-- Row 2 -->
            <rect y="200" width="220" height="180" rx="10" fill="#fff" stroke="#ccc"/>
            <rect x="10" y="210" width="200" height="80" fill="#e5e7eb" rx="5"/>
            <text x="20" y="315" font-family="Arial" font-size="16" font-weight="bold">Chủ đề 4</text>

            <rect x="240" y="200" width="220" height="180" rx="10" fill="#fff" stroke="#ccc"/>
            <rect x="250" y="210" width="200" height="80" fill="#e5e7eb" rx="5"/>
            <text x="260" y="315" font-family="Arial" font-size="16" font-weight="bold">Chủ đề 5</text>

            <rect x="480" y="200" width="220" height="180" rx="10" fill="#fff" stroke="#ccc"/>
            <rect x="490" y="210" width="200" height="80" fill="#e5e7eb" rx="5"/>
            <text x="500" y="315" font-family="Arial" font-size="16" font-weight="bold">Chủ đề 6</text>
        </g>

        <!-- Pagination -->
        <g transform="translate(250, 450)">
            <text x="0" y="0" font-family="Arial" font-size="14" fill="#666">Trang:</text>
            <rect x="40" y="-15" width="30" height="30" rx="5" fill="#2196F3"/>
            <text x="50" y="5" font-family="Arial" font-size="14" fill="#fff">1</text>
            <rect x="80" y="-15" width="30" height="30" rx="5" fill="#fff" stroke="#ccc"/>
            <text x="90" y="5" font-family="Arial" font-size="14" fill="#333">2</text>
            <rect x="120" y="-15" width="30" height="30" rx="5" fill="#fff" stroke="#ccc"/>
            <text x="130" y="5" font-family="Arial" font-size="14" fill="#333">3</text>
            <text x="160" y="5" font-family="Arial" font-size="14" fill="#333">...</text>
            <rect x="190" y="-15" width="60" height="30" rx="5" fill="#fff" stroke="#ccc"/>
            <text x="200" y="5" font-family="Arial" font-size="14" fill="#333">Tiếp</text>
        </g>
    </g>

    <!-- Footer -->
    <rect y="560" width="100%" height="40" fill="#dcdcdc"/>
    <text x="320" y="585" font-family="Arial" font-size="12" fill="#333">Copyright © 2025</text>
</svg>