<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#f0f0f0"/>
    <rect width="100%" height="60" fill="#dcdcdc"/>
    <text x="20" y="35" font-family="Arial" font-size="18">Quiz-Bank Logo</text>
    <text x="700" y="35" font-family="Arial" font-size="16">User Name</text>
    <g transform="translate(0, 60)">
        <text x="50" y="50" font-family="Arial" font-size="24" font-weight="bold">Hồ sơ của tôi</text>

        <!-- User Info & Stats -->
        <rect x="50" y="80" width="700" height="100" rx="10" fill="#fff" stroke="#ccc"/>
        <circle cx="110" cy="130" r="30" fill="#ccc"/>
        <text x="160" y="120" font-family="Arial" font-size="18">User Name</text>
        <text x="160" y="145" font-family="Arial" font-size="14" fill="#666">user@example.com</text>
        <text x="400" y="135" font-family="Arial" font-size="16">Điểm TB: 8.5 | Đã làm: 15 quizzes</text>

        <!-- Quiz History -->
        <text x="50" y="220" font-family="Arial" font-size="18">Lịch sử làm bài</text>
        <rect x="50" y="240" width="700" height="250" fill="#fff" stroke="#ccc"/>
        <!-- Table Header -->
        <text x="70" y="265" font-family="Arial" font-size="14" font-weight="bold">Tên Quiz</text>
        <text x="350" y="265" font-family="Arial" font-size="14" font-weight="bold">Ngày làm</text>
        <text x="550" y="265" font-family="Arial" font-size="14" font-weight="bold">Điểm</text>
        <line x1="50" y1="280" x2="750" y2="280" stroke="#ccc"/>
        <!-- Table Row 1 -->
        <text x="70" y="305" font-family="Arial" font-size="14">Data Structures</text>
        <text x="350" y="305" font-family="Arial" font-size="14">20/10/2025</text>
        <text x="550" y="305" font-family="Arial" font-size="14">9/10</text>
        <!-- Table Row 2 -->
        <text x="70" y="335" font-family="Arial" font-size="14">Algorithms</text>
        <text x="350" y="335" font-family="Arial" font-size="14">18/10/2025</text>
        <text x="550" y="335" font-family="Arial" font-size="14">7/10</text>
    </g>
    <rect y="560" width="100%" height="40" fill="#dcdcdc"/>
</svg>